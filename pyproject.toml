[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zephyr-cli"
version = "0.1.0.dev0"
description = "Agent-optimized CLI for Zephyr RTOS: build, inspect, emulate, and skill-manage Zephyr projects"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Jonathan Beri", email = "jonathan@golioth.io" }]
keywords = ["zephyr", "rtos", "embedded", "west", "agent", "cli"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "httpx>=0.27",
    "rich>=13.7",
    "tomli>=2.0; python_version < '3.11'",
    "west>=1.2",
    "platformdirs>=4.2",
    "pyelftools>=0.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-subprocess>=1.5",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "pyright>=1.1",
    "hatch>=1.12",
]

[project.scripts]
zephyr-cli = "zephyr_cli.main:app"

[project.entry-points."west.commands"]
agent = "zephyr_cli.west_agent:AgentCommand"

[project.urls]
Homepage = "https://github.com/beriberikix/zephyr-cli"
Repository = "https://github.com/beriberikix/zephyr-cli"
Issues = "https://github.com/beriberikix/zephyr-cli/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/zephyr_cli"]

[tool.ruff]
src = ["src"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.11"
include = ["src"]
venvPath = "."
venv = ".venv"
strict = []
reportMissingImports = true
reportMissingModuleSource = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["src/zephyr_cli"]
omit = ["*/tests/*"]
