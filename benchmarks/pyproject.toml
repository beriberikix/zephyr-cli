[project]
name = "zephyr-cli-benchmarks"
version = "0.1.0"
description = "A/B evaluation framework for zephyr-cli + zephyr-agent-skills"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
